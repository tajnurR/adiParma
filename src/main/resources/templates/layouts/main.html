<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:fragment="layout(content)">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title th:text="${title} ?: 'AdiPharma'">AdiPharma</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@400;500;600" rel="stylesheet"/>
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        html, body { height: 100%; }
        body { font-family: "Inter", sans-serif; margin: 0; }
        .material-symbols-outlined { font-variation-settings: "FILL" 0, "wght" 500, "GRAD" 0, "opsz" 24; }
        .menu-item.active {
            background: linear-gradient(90deg, #3b82f6, #1d4ed8);
            color: #ffffff;
            box-shadow: 0 1px 2px rgba(15, 23, 42, 0.12);
        }
    </style>
</head>
<body class="bg-[#eef4fb]">
<div class="min-h-screen flex">
    <div th:replace="~{fragments/sidebar :: sidebar}"></div>

    <main class="flex-1 pr-6 pb-6 pt-0 flex flex-col gap-3">
        <header class="border-b border-[#e5e7eb] bg-white px-6 py-2 shadow-sm flex flex-col gap-2 md:flex-row md:items-center md:justify-between">
            <div class="flex flex-wrap items-center gap-2 md:gap-3">
                <div class="flex items-center gap-2 rounded-lg border border-[#e5e7eb] bg-[#f8fafc] px-2.5 py-1.5 text-xs text-[#475569]">
                    <span class="material-symbols-outlined text-[16px] text-[#2563eb]">calendar_month</span>
                    <span id="app-current-date">—</span>
                </div>
                <div class="flex items-center gap-2 rounded-lg border border-[#e5e7eb] bg-[#f8fafc] px-2.5 py-1.5 text-xs text-[#475569]">
                    <span class="material-symbols-outlined text-[16px] text-[#16a34a]">event_available</span>
                    <span id="app-day-status" class="font-medium text-[#0f172a]">Day Open</span>
                </div>
                <div id="app-connection-status" class="flex items-center gap-2 rounded-lg border border-[#e5e7eb] bg-[#f8fafc] px-2.5 py-1.5 text-xs">
                    <span class="material-symbols-outlined text-[16px]">cloud_done</span>
                    <span class="font-medium">Online</span>
                </div>
            </div>
            <div class="flex items-center gap-3">
                <div class="w-9 h-9 rounded-full bg-gradient-to-br from-[#3b82f6] to-[#1d4ed8] text-white flex items-center justify-center text-xs font-semibold">
                    AR
                </div>
                <div>
                    <div class="text-sm font-semibold text-[#0f172a]">AdiPharma Admin</div>
                    <div class="text-xs text-[#64748b]">System Operator</div>
                </div>
            </div>
        </header>
        <div id="main-content" class="flex-1" th:insert="${content}"></div>
    </main>
</div>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script>
    $(function () {
        function initHeaderStatus() {
            const dateEl = document.getElementById("app-current-date");
            const statusEl = document.getElementById("app-connection-status");
            if (dateEl) {
                const now = new Date();
                dateEl.textContent = now.toLocaleDateString("en-GB", {
                    day: "2-digit",
                    month: "short",
                    year: "numeric"
                });
            }
            const updateConnection = () => {
                if (!statusEl) return;
                const icon = statusEl.querySelector(".material-symbols-outlined");
                const label = statusEl.querySelector("span:last-child");
                const isOnline = navigator.onLine;
                statusEl.classList.toggle("text-[#16a34a]", isOnline);
                statusEl.classList.toggle("text-[#dc2626]", !isOnline);
                statusEl.classList.toggle("bg-[#f0fdf4]", isOnline);
                statusEl.classList.toggle("bg-[#fef2f2]", !isOnline);
                if (icon) {
                    icon.textContent = isOnline ? "cloud_done" : "cloud_off";
                    icon.classList.toggle("text-[#16a34a]", isOnline);
                    icon.classList.toggle("text-[#dc2626]", !isOnline);
                }
                if (label) {
                    label.textContent = isOnline ? "Online" : "Offline";
                }
            };
            updateConnection();
            window.addEventListener("online", updateConnection);
            window.addEventListener("offline", updateConnection);
        }

        initHeaderStatus();
        const pages = {
            overview: {
                html: "/business-pages/overview/overview.html",
                css: "/business-pages/overview/overview.css",
                js: "/business-pages/overview/overview.js"
            },
            pos: {
                html: "/business-pages/point-of-sale/point-of-sale.html",
                css: "/business-pages/point-of-sale/point-of-sale.css",
                js: "/business-pages/point-of-sale/point-of-sale.js"
            },
            customer: {
                html: "/business-pages/customer/customer.html",
                css: "/business-pages/customer/customer.css",
                js: "/business-pages/customer/customer.js"
            },
            customerSales: {
                html: "/business-pages/customer-sales/customer-sales.html",
                css: "/business-pages/customer-sales/customer-sales.css",
                js: "/business-pages/customer-sales/customer-sales.js"
            },
            productCatalog: {
                html: "/business-pages/product-catalog/product-catalog.html",
                css: "/business-pages/product-catalog/product-catalog.css",
                js: "/business-pages/product-catalog/product-catalog.js"
            },
            stockAlerts: {
                html: "/business-pages/stock-alerts/stock-alerts.html",
                css: "/business-pages/stock-alerts/stock-alerts.css",
                js: "/business-pages/stock-alerts/stock-alerts.js"
            },
            reports: {
                html: "/business-pages/reports/reports.html",
                css: "/business-pages/reports/reports.css",
                js: "/business-pages/reports/reports.js"
            },
            transactions: {
                html: "/business-pages/transactions/transactions.html",
                css: "/business-pages/transactions/transactions.css",
                js: "/business-pages/transactions/transactions.js"
            },
            stock: {
                html: "/business-pages/stock/stock.html",
                css: "/business-pages/stock/stock.css",
                js: "/business-pages/stock/stock.js"
            }
        };
        const commonAssets = {
            css: "/business-pages/common/common.css",
            js: [
                "/business-pages/common/common.js",
                "/business-pages/common/customer-dropdown-service.js",
                "/business-pages/common/toast-service.js"
            ]
        };

        const $content = $("#main-content");

        function ensureStyle(id, href) {
            if (!document.getElementById(id)) {
                $("<link>", { id, rel: "stylesheet", href }).appendTo("head");
            }
        }

        function loadScriptOnce(id, src) {
            return new Promise((resolve, reject) => {
                if (document.getElementById(id)) {
                    resolve();
                    return;
                }
                const script = document.createElement("script");
                script.id = id;
                script.src = src;
                script.onload = () => resolve();
                script.onerror = () => reject(new Error("Failed to load script"));
                document.body.appendChild(script);
            });
        }

        async function ensureCommonAssets() {
            ensureStyle("bp-style-common", commonAssets.css);
            try {
                for (const src of commonAssets.js) {
                    const id = `bp-script-${src.split("/").pop().replace(/\W+/g, "-")}`;
                    await loadScriptOnce(id, src);
                }
            } catch (error) {
                // Keep navigation functional even if common assets fail.
            }
        }

        async function renderPage(key) {
            const pageKey = pages[key] ? key : "overview";
            const page = pages[pageKey];

            await ensureCommonAssets();
            ensureStyle(`bp-style-${pageKey}`, page.css);

            try {
                const html = await $.get(page.html);
                $content.html(html);
            } catch (error) {
                $content.html(
                    `<section class="rounded-xl border border-[#e5e7eb] bg-white p-6 shadow-sm">
                        <p class="text-[#b91c1c]">Unable to load page content.</p>
                    </section>`
                );
            }

            try {
                await loadScriptOnce(`bp-script-${pageKey}`, page.js);
                if (window.BusinessPages && window.BusinessPages[pageKey] && typeof window.BusinessPages[pageKey].init === "function") {
                    window.BusinessPages[pageKey].init($content[0]);
                }
            } catch (error) {
                // Keep UI responsive even if page script fails.
            }

            $(".menu-item").removeClass("active").attr("aria-current", "false");
            const activeKey = pageKey === "customerSales" ? "customer" : pageKey;
            $(`.menu-item[data-page="${activeKey}"]`).addClass("active").attr("aria-current", "page");
        }

        function getPageKeyFromPath() {
            const path = window.location.pathname || "/";
            if (path === "/pos") return "pos";
            if (path === "/customers") return "customer";
            if (/^\/customers\/\d+\/sales$/.test(path)) return "customerSales";
            if (path === "/products") return "productCatalog";
            if (path === "/stock-alerts") return "stockAlerts";
            if (path === "/reports") return "reports";
            if (path === "/transactions") return "transactions";
            if (path === "/stock") return "stock";
            return "overview";
        }

        $(".menu-item[data-page]").on("click", function (event) {
            event.preventDefault();
            const key = $(this).data("page");
            renderPage(key);
        });

        $("#toggleBtn").on("click", function () {
            const $sidebar = $("#sidebar");
            const isCollapsed = $sidebar.hasClass("w-[80px]");

            if (isCollapsed) {
                $sidebar.removeClass("w-[80px]").addClass("w-[240px]");
                $(".sidebar-text").removeClass("hidden");
                $("#toggleBtn .material-symbols-outlined").text("menu_open");
            } else {
                $sidebar.removeClass("w-[240px]").addClass("w-[80px]");
                $(".sidebar-text").addClass("hidden");
                $("#toggleBtn .material-symbols-outlined").text("menu");
            }
        });

        renderPage(getPageKeyFromPath());
    });
</script>
</body>
</html>
