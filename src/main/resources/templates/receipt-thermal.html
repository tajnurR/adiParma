<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>Thermal Receipt</title>
    <style>
        @page {
            size: 80mm auto;
            margin: 0;
        }
        * {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            padding: 6mm 4mm 8mm;
            width: 80mm;
            font-family: "Courier New", "Lucida Console", monospace;
            font-size: 11px;
            color: #000000;
            background: #ffffff;
        }
        .center {
            text-align: center;
        }
        .title {
            font-weight: 700;
            letter-spacing: 0.2em;
            margin: 6px 0;
        }
        .meta {
            margin: 6px 0;
            line-height: 1.5;
        }
        .separator {
            border-top: 1px dashed #000000;
            margin: 6px 0;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 10.5px;
        }
        th, td {
            padding: 4px 0;
            vertical-align: top;
        }
        th {
            text-align: left;
            border-bottom: 1px dashed #000000;
        }
        .col-qty {
            width: 36px;
            text-align: center;
        }
        .col-price {
            width: 64px;
            text-align: right;
        }
        .totals {
            display: flex;
            justify-content: space-between;
            font-weight: 700;
            margin-top: 6px;
        }
        .footer {
            font-size: 10px;
            line-height: 1.4;
            text-align: center;
            margin-top: 8px;
        }
    </style>
</head>
<body>
    <div class="center">
        <div style="font-weight: 700;" th:text="${invoice.pharmacyName}">AdiPharma Pharmacy</div>
        <div class="meta" th:if="${invoice.pharmacyAddress}" th:text="${invoice.pharmacyAddress}">
            Pharmacy Address
        </div>
        <div class="meta">
            <div th:if="${invoice.pharmacyPhone}" th:text="'Phone: ' + ${invoice.pharmacyPhone}">Phone</div>
            <div th:if="${invoice.pharmacyEmail}" th:text="'Email: ' + ${invoice.pharmacyEmail}">Email</div>
        </div>
    </div>

    <div class="separator"></div>
    <div class="title center">SALES RECEIPT</div>
    <div class="separator"></div>

    <div class="meta">
        <div><strong>Invoice #:</strong> <span th:text="${invoice.invoiceNo}">—</span></div>
        <div><strong>Date:</strong> <span th:text="${invoice.invoiceDate}">—</span></div>
        <div><strong>Customer:</strong> <span th:text="${invoice.billToName}">Walk-in Customer</span></div>
        <div><strong>Payment:</strong> <span th:text="${invoice.paymentMethod}">Cash</span></div>
        <div><strong>Processed by:</strong> <span th:text="${invoice.processedBy}">—</span></div>
    </div>

    <div class="separator"></div>

    <table>
        <thead>
        <tr>
            <th>Item</th>
            <th class="col-qty">Qty</th>
            <th class="col-price">Amount</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="item : ${invoice.items}">
            <td>
                <div th:text="${item.name}">Item</div>
                <div style="font-size: 9px;" th:if="${item.code}" th:text="${item.code}">Code</div>
            </td>
            <td class="col-qty" th:text="${item.qty}">1</td>
            <td class="col-price" th:text="${item.total}">৳0.00</td>
        </tr>
        </tbody>
    </table>

    <div class="separator"></div>
    <div class="totals">
        <span>TOTAL</span>
        <span th:text="${invoice.grandTotal}">৳0.00</span>
    </div>

    <div class="separator"></div>
    <div class="footer" th:text="${invoice.footerNote}">
        Thank you for choosing AdiPharma Pharmacy.
    </div>

    <script>
        window.addEventListener("load", () => {
            window.print();
        });
    </script>
</body>
</html>
