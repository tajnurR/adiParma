<section class="profile-page">
    <div class="profile-header">
        <div>
            <h1 class="profile-title">Business Profile</h1>
            <p class="profile-subtitle">Manage common application and pharmacy information.</p>
        </div>
        <div class="profile-logo">
            <div id="profile-logo" class="profile-avatar">A</div>
            <div>
                <div id="profile-logo-name" class="profile-logo-name">AdiPharma Pharmacy</div>
                <div id="profile-logo-tagline" class="profile-logo-tagline">Admin Panel</div>
            </div>
        </div>
    </div>

    <form id="profile-settings-form" class="profile-form">
        <div class="profile-section">
            <h2>Pharmacy Information</h2>
            <div class="profile-grid">
                <label class="profile-field">
                    <span>Pharmacy Name</span>
                    <input type="text" name="pharmacyName" placeholder="Enter pharmacy name" required />
                </label>
                <label class="profile-field">
                    <span>Tagline</span>
                    <input type="text" name="pharmacyTagline" placeholder="Admin Panel" />
                </label>
            </div>
        </div>

        <div class="profile-section">
            <h2>Contact Information</h2>
            <div class="profile-grid">
                <label class="profile-field">
                    <span>Phone</span>
                    <input type="text" name="pharmacyPhone" placeholder="Phone number" />
                </label>
                <label class="profile-field">
                    <span>Email</span>
                    <input type="email" name="pharmacyEmail" placeholder="Email address" />
                </label>
            </div>
            <label class="profile-field">
                <span>Address</span>
                <textarea name="pharmacyAddress" rows="3" placeholder="Street, city, country"></textarea>
            </label>
        </div>

        <div class="profile-section">
            <h2>Invoice & Receipt Settings</h2>
            <div class="profile-grid">
                <label class="profile-field">
                    <span>Invoice Title</span>
                    <input type="text" name="invoiceTitle" placeholder="INVOICE" />
                </label>
                <label class="profile-field">
                    <span>Receipt Title</span>
                    <input type="text" name="receiptTitle" placeholder="SALES RECEIPT" />
                </label>
                <label class="profile-field">
                    <span>Currency Symbol</span>
                    <input type="text" name="currencySymbol" placeholder="৳" />
                </label>
                <label class="profile-field">
                    <span>Bill To Label</span>
                    <input type="text" name="billToLabel" placeholder="Bill To" />
                </label>
                <label class="profile-field">
                    <span>Walk-in Customer Label</span>
                    <input type="text" name="walkInCustomerLabel" placeholder="Walk-in Customer" />
                </label>
                <label class="profile-field">
                    <span>Receipt Customer Label</span>
                    <input type="text" name="customerLabel" placeholder="Customer" />
                </label>
                <label class="profile-field">
                    <span>Invoice Number Label</span>
                    <input type="text" name="invoiceNoLabel" placeholder="Invoice #" />
                </label>
                <label class="profile-field">
                    <span>Invoice Date Label</span>
                    <input type="text" name="invoiceDateLabel" placeholder="Date" />
                </label>
                <label class="profile-field">
                    <span>Payment Label</span>
                    <input type="text" name="paymentLabel" placeholder="Payment" />
                </label>
                <label class="profile-field">
                    <span>Processed By Label</span>
                    <input type="text" name="processedByLabel" placeholder="Processed by" />
                </label>
                <label class="profile-field">
                    <span>Item Column Label</span>
                    <input type="text" name="itemLabel" placeholder="Item" />
                </label>
                <label class="profile-field">
                    <span>Quantity Column Label</span>
                    <input type="text" name="qtyLabel" placeholder="Qty" />
                </label>
                <label class="profile-field">
                    <span>Unit Price Column Label</span>
                    <input type="text" name="unitPriceLabel" placeholder="Unit Price" />
                </label>
                <label class="profile-field">
                    <span>Discount Label</span>
                    <input type="text" name="discountLabel" placeholder="Discount" />
                </label>
                <label class="profile-field">
                    <span>Amount Column Label</span>
                    <input type="text" name="amountLabel" placeholder="Amount" />
                </label>
                <label class="profile-field">
                    <span>Subtotal Label</span>
                    <input type="text" name="subtotalLabel" placeholder="Subtotal" />
                </label>
                <label class="profile-field">
                    <span>Grand Total Label</span>
                    <input type="text" name="grandTotalLabel" placeholder="Grand Total" />
                </label>
                <label class="profile-field">
                    <span>Invoice Footer Note</span>
                    <textarea name="invoiceFooterNote" rows="3" placeholder="Invoice footer note"></textarea>
                </label>
                <label class="profile-field">
                    <span>Receipt Footer Note</span>
                    <textarea name="receiptFooterNote" rows="3" placeholder="Receipt footer note"></textarea>
                </label>
            </div>
        </div>

        <div class="profile-actions">
            <button type="submit" class="profile-save-btn">Save Settings</button>
        </div>
    </form>
</section>
