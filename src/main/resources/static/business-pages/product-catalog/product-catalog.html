<section class="product-page">
    <div class="product-header">
        <h1 class="product-title">Product Catalog</h1>
        <div class="product-header-actions">
            <button class="product-btn product-btn-success product-bulk-btn" type="button">
                <span class="material-symbols-outlined">upload</span>
                Bulk Import
            </button>
            <button class="product-btn product-btn-primary product-add-btn" type="button">
                <span class="material-symbols-outlined">add</span>
                Add Product
            </button>
        </div>
    </div>

    <div class="product-filters">
        <div class="product-search">
            <span class="material-symbols-outlined">search</span>
            <input
                id="product-search"
                type="text"
                placeholder="Search by name, generic name, SKU, or manufacturer..."
                aria-label="Search products"
            />
        </div>
        <select id="product-category" class="product-category-select" aria-label="Filter by category">
            <option value="" selected>All Categories</option>
        </select>
    </div>

    <div class="product-toolbar">
        <div class="product-toolbar-left">
            <label for="product-sort">Sort by:</label>
            <select id="product-sort">
                <option value="name" selected>Name</option>
                <option value="price">Price</option>
                <option value="stock">Stock</option>
            </select>
            <button id="product-sort-direction" type="button" class="product-sort-btn" aria-label="Sort ascending">
                <span class="material-symbols-outlined">north</span>
            </button>

            <label for="product-page-size">Per page:</label>
            <select id="product-page-size">
                <option value="10">10</option>
                <option value="20" selected>20</option>
                <option value="50">50</option>
            </select>
        </div>
        <div class="product-toolbar-right" id="product-result-count">Showing 0 to 0 of 0 results</div>
    </div>

    <div class="product-table-wrapper">
        <table class="product-table">
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Category</th>
                    <th>Code</th>
                    <th>Price</th>
                    <th>Requires Rx</th>
                    <th class="product-actions-col">Actions</th>
                </tr>
            </thead>
            <tbody id="product-table-body">
                <tr>
                    <td colspan="6" class="product-empty">Loading products...</td>
                </tr>
            </tbody>
        </table>
    </div>

    <div class="product-pagination" id="product-pagination"></div>
</section>

<div class="product-modal" id="product-modal" aria-hidden="true">
    <div class="product-modal-backdrop" data-action="close-product-modal"></div>
    <div class="product-modal-card" role="dialog" aria-modal="true" aria-labelledby="product-modal-title">
        <div class="product-modal-header">
            <h2 class="product-modal-title" id="product-modal-title">Add New Product</h2>
            <button type="button" class="product-modal-close" data-action="close-product-modal" aria-label="Close">
                <span class="material-symbols-outlined">close</span>
            </button>
        </div>
        <form class="product-modal-form" id="product-modal-form">
            <div class="product-modal-grid">
                <label class="product-modal-field">
                    <span>Product Name <span class="required-indicator">*</span></span>
                    <div class="product-input">
                        <span class="material-symbols-outlined">inventory_2</span>
                        <input type="text" name="name" placeholder="Enter product name" required />
                    </div>
                </label>
                <label class="product-modal-field">
                    <span>Generic Name <span class="required-indicator">*</span></span>
                    <div class="product-input">
                        <span class="material-symbols-outlined">medical_information</span>
                        <select name="genericId" required>
                            <option value="" disabled selected>Select generic name</option>
                        </select>
                    </div>
                </label>
            </div>

            <label class="product-modal-field">
                <span>Description</span>
                <div class="product-input">
                    <span class="material-symbols-outlined">description</span>
                    <textarea name="description" placeholder="Enter product description (optional)" rows="3"></textarea>
                </div>
            </label>

            <div class="product-modal-grid product-modal-grid-3">
                <label class="product-modal-field">
                    <span>Category <span class="required-indicator">*</span></span>
                    <div class="product-input">
                        <span class="material-symbols-outlined">category</span>
                        <select name="category" required>
                            <option value="" disabled selected>Select category</option>
                        </select>
                    </div>
                </label>
                <label class="product-modal-field">
                    <span>Manufacturer <span class="required-indicator">*</span></span>
                    <div class="product-input">
                        <span class="material-symbols-outlined">factory</span>
                        <select name="manufacturerId" required>
                            <option value="" disabled selected>Select manufacturer</option>
                        </select>
                    </div>
                </label>
                <label class="product-modal-field">
                    <span>Code <span class="required-indicator">*</span></span>
                    <div class="product-input">
                        <span class="material-symbols-outlined">barcode</span>
                        <input
                            type="text"
                            name="code"
                            placeholder="Enter product code"
                            required
                            pattern="M\\d{6}"
                            maxlength="7"
                            minlength="7"
                            title="Format must be M followed by 6 digits (e.g., M217156)"
                        />
                    </div>
                    <small class="product-helper">Stock Keeping Unit - Unique identifier for the product</small>
                </label>
            </div>

            <div class="product-modal-section" id="product-pricing-section">
                <h3>Pricing Information</h3>
                <div class="product-modal-grid">
                    <label class="product-modal-field">
                        <span>Selling Price <span class="required-indicator">*</span></span>
                        <div class="product-input">
                            <span class="material-symbols-outlined">payments</span>
                            <input type="number" name="sellingPrice" min="0" step="0.01" value="0" required />
                        </div>
                        <div class="product-preview" id="product-selling-preview">Preview: ৳0.00</div>
                    </label>
                    <label class="product-modal-field">
                        <span>Cost Price <span class="required-indicator">*</span></span>
                        <div class="product-input">
                            <span class="material-symbols-outlined">payments</span>
                            <input type="number" name="costPrice" min="0" step="0.01" value="0" required />
                        </div>
                        <div class="product-preview" id="product-cost-preview">Preview: ৳0.00</div>
                    </label>
                </div>
                <div class="product-modal-grid">
                    <label class="product-modal-field">
                        <span>Stock Qty <span class="required-indicator">*</span></span>
                        <div class="product-input">
                            <span class="material-symbols-outlined">inventory</span>
                            <input type="number" name="qty" min="0" step="1" value="0" required />
                        </div>
                    </label>
                    <label class="product-modal-field">
                        <span>Expire Date <span class="required-indicator">*</span></span>
                        <div class="product-input">
                            <span class="material-symbols-outlined">event</span>
                            <input type="date" name="expireDate" required />
                        </div>
                    </label>
                </div>
                <div class="product-profit" id="product-profit-margin">Profit Margin: 0.0%</div>
            </div>

            <div class="product-modal-section">
                <h3>Additional Settings</h3>
                <label class="product-toggle">
                    <input type="checkbox" name="requiresRx" />
                    <div>
                        <strong>Requires Prescription</strong>
                        <span>Enable if this product requires a prescription</span>
                    </div>
                </label>
                <label class="product-toggle">
                    <input type="checkbox" name="trackExpiry" checked />
                    <div>
                        <strong>Track Expiry Date</strong>
                        <span>Enable to track expiry dates for this product</span>
                    </div>
                </label>
            </div>

            <div class="product-modal-actions">
                <button type="button" class="product-modal-cancel" data-action="close-product-modal">Cancel</button>
                <button type="submit" class="product-modal-submit">Create Product</button>
            </div>
        </form>
    </div>
</div>

<div class="product-modal product-barcode-modal" id="product-barcode-modal" aria-hidden="true">
    <div class="product-modal-backdrop" data-action="close-barcode-modal"></div>
    <div class="product-modal-card product-barcode-card" role="dialog" aria-modal="true" aria-labelledby="barcode-modal-title">
        <div class="product-modal-header">
            <h2 class="product-modal-title" id="barcode-modal-title">Product Barcode</h2>
            <button type="button" class="product-modal-close" data-action="close-barcode-modal" aria-label="Close">
                <span class="material-symbols-outlined">close</span>
            </button>
        </div>
        <div class="product-barcode-body">
            <div class="product-barcode-preview">
                <div class="product-barcode-svg" id="barcode-preview-svg"></div>
                <div class="product-barcode-code" id="barcode-preview-code"></div>
            </div>

            <div class="product-barcode-section">
                <div class="product-barcode-section-title">Print Configuration</div>

                <label class="product-modal-field">
                    <span>Barcode Size</span>
                    <select id="barcode-size">
                        <option value="small">Small (30mm)</option>
                        <option value="medium" selected>Medium (40mm)</option>
                        <option value="large">Large (50mm)</option>
                        <option value="xlarge">Extra Large (60mm)</option>
                    </select>
                </label>

                <div class="product-barcode-radio-group">
                    <div class="product-barcode-section-title">Printer Type</div>
                    <label class="product-radio-card">
                        <input type="radio" name="barcode-printer" value="laser" checked />
                        <span>Laser/Inkjet Printer</span>
                    </label>
                    <label class="product-radio-card">
                        <input type="radio" name="barcode-printer" value="barcode" />
                        <span>Barcode Printer</span>
                    </label>
                </div>

                <label class="product-modal-field">
                    <span>Layout Options</span>
                    <select id="barcode-layout">
                        <option value="custom">Custom Quantity</option>
                        <option value="a4-4">A4 - 4 Labels per Page</option>
                        <option value="a4-8" selected>A4 - 8 Labels per Page</option>
                        <option value="a4-16">A4 - 16 Labels per Page</option>
                        <option value="a4-32">A4 - 32 Labels per Page</option>
                    </select>
                </label>

                <label class="product-modal-field" id="barcode-quantity-field">
                    <span>Print Quantity</span>
                    <select id="barcode-quantity"></select>
                </label>

                <div class="product-barcode-section-title">Label Content</div>
                <label class="product-checkbox-card">
                    <input type="checkbox" id="barcode-show-code" />
                    <span>Show Code</span>
                </label>
            </div>

            <div class="product-modal-actions">
                <button type="button" class="product-modal-submit" id="barcode-print-btn">
                    <span class="material-symbols-outlined">print</span>
                    Print Label
                </button>
                <button type="button" class="product-modal-outline" id="barcode-pdf-btn">
                    <span class="material-symbols-outlined">download</span>
                    Download PDF
                </button>
            </div>
        </div>
    </div>
</div>

<div class="product-modal product-pricing-modal" id="product-pricing-modal" aria-hidden="true">
    <div class="product-modal-backdrop" data-action="close-pricing-modal"></div>
    <div class="product-modal-card product-pricing-card" role="dialog" aria-modal="true" aria-labelledby="pricing-modal-title">
        <div class="product-modal-header">
            <h2 class="product-modal-title" id="pricing-modal-title">Pricing Information</h2>
            <button type="button" class="product-modal-close" data-action="close-pricing-modal" aria-label="Close">
                <span class="material-symbols-outlined">close</span>
            </button>
        </div>
        <form class="product-modal-form" id="product-pricing-form">
            <div class="product-pricing-preview">
                <div class="product-pricing-name" id="pricing-product-name"></div>
                <div class="product-pricing-code" id="pricing-product-code"></div>
            </div>

            <div class="product-modal-section">
                <h3>Pricing & Stock</h3>
                <div class="product-modal-grid">
                    <label class="product-modal-field">
                        <span>Selling Price <span class="required-indicator">*</span></span>
                        <div class="product-input">
                            <span class="material-symbols-outlined">payments</span>
                            <input type="number" name="sellingPrice" min="0" step="0.01" value="0" required />
                        </div>
                    </label>
                    <label class="product-modal-field">
                        <span>Cost Price <span class="required-indicator">*</span></span>
                        <div class="product-input">
                            <span class="material-symbols-outlined">payments</span>
                            <input type="number" name="costPrice" min="0" step="0.01" value="0" required />
                        </div>
                    </label>
                </div>
                <div class="product-modal-grid">
                    <label class="product-modal-field">
                        <span>Stock Qty <span class="required-indicator">*</span></span>
                        <div class="product-input">
                            <span class="material-symbols-outlined">inventory</span>
                            <input type="number" name="qty" min="0" step="1" value="0" required />
                        </div>
                    </label>
                    <label class="product-modal-field">
                        <span>Expire Date <span class="required-indicator">*</span></span>
                        <div class="product-input">
                            <span class="material-symbols-outlined">event</span>
                            <input type="date" name="expireDate" required />
                        </div>
                    </label>
                </div>
            </div>

            <div class="product-modal-actions">
                <button type="button" class="product-modal-outline" data-action="close-pricing-modal">Cancel</button>
                <button type="submit" class="product-modal-submit">Save Pricing</button>
            </div>
        </form>
    </div>
</div>
